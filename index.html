<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#050811">
  <meta name="description" content="MovieList - Modern Glassmorphism Cinema Streaming Platform with Cinema Suite">
  <title>MovieList - Modern Cinema Streaming</title>
  
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- Modern Glassmorphism Stylesheet -->
  <link rel="stylesheet" href="css/movielist.css">
</head>
<body>
  <!-- Animated Aurora Mesh Fluid Ambient Background -->
  <div class="aurora-mesh-container" aria-hidden="true">
    <div class="aurora-orb aurora-orb-1"></div>
    <div class="aurora-orb aurora-orb-2"></div>
    <div class="aurora-orb aurora-orb-3"></div>
  </div>

  <div class="app-layout">
    <!-- Floating Island Glass Header -->
    <header class="main-header">
      <a href="#" class="brand-container" onclick="window.MovieList.setCategory('All'); return false;" aria-label="MovieList Home">
        <div class="brand-mark">
          <i data-lucide="clapperboard" style="width:20px;height:20px;"></i>
        </div>
        <span class="brand-title">MovieList</span>
      </a>

      <!-- Desktop Nav Pills -->
      <nav class="nav-menu" aria-label="Primary Navigation">
        <button class="nav-link active" data-category="All" onclick="window.MovieList.setCategory('All')">Home</button>
        <button class="nav-link" data-category="Hollywood 1080p" onclick="window.MovieList.setCategory('Hollywood 1080p')">Hollywood</button>
        <button class="nav-link" data-category="Bollywood" onclick="window.MovieList.setCategory('Bollywood')">Bollywood</button>
        <button class="nav-link" data-category="TV Series" onclick="window.MovieList.setCategory('TV Series')">TV Shows</button>
        <button class="nav-link" data-category="K-Drama" onclick="window.MovieList.setCategory('K-Drama')">K-Drama</button>
        <button class="nav-link" data-category="Animation" onclick="window.MovieList.setCategory('Animation')">Animation</button>
        <button class="nav-link" data-category="Watchlist" onclick="window.MovieList.setCategory('Watchlist')">Watchlist</button>
      </nav>

      <!-- Header Search & Controls -->
      <div class="header-actions">
        <div class="search-pill-wrapper">
          <input type="text" id="searchInput" class="search-input" placeholder="Search movies, series..." aria-label="Search movies">
          <button class="search-icon-btn" aria-label="Submit search">
            <i data-lucide="search" style="width:16px;height:16px;"></i>
          </button>
        </div>

        <button class="icon-action-btn" id="themeToggleBtn" onclick="window.MovieList.toggleTheme()" title="Toggle Theme" aria-label="Toggle dark and light theme">
          <i id="themeIcon" data-lucide="sun" style="width:18px;height:18px;"></i>
        </button>

        <button class="icon-action-btn" onclick="window.MovieList.setCategory('Watchlist')" title="View Watchlist" aria-label="View Watchlist">
          <i data-lucide="bookmark" style="width:18px;height:18px;"></i>
          <span class="watchlist-badge-count" id="watchlistBadge" style="display: none;">0</span>
        </button>
      </div>
    </header>

    <!-- Hero Featured Carousel -->
    <section class="hero-carousel-section" id="heroCarousel" aria-label="Featured Releases">
      <div class="carousel-slide-viewport" id="heroCarouselSlides"></div>

      <!-- Arrow Controls -->
      <button class="carousel-nav-btn carousel-nav-prev" onclick="window.MovieList.prevSlide()" aria-label="Previous Slide">
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </button>
      <button class="carousel-nav-btn carousel-nav-next" onclick="window.MovieList.nextSlide()" aria-label="Next Slide">
        <i data-lucide="chevron-right" style="width:20px;height:20px;"></i>
      </button>

      <!-- Dot Indicators -->
      <div class="carousel-indicators" id="carouselIndicators"></div>
    </section>

    <!-- Continue Watching Shelf -->
    <section class="continue-watching-section" id="continueWatchingSection" style="display: none;" aria-label="Continue Watching">
      <div class="cw-header-row">
        <h3 class="cw-title">
          <i data-lucide="history" style="width:20px;height:20px;color:var(--primary);"></i>
          <span>Continue Watching</span>
        </h3>
      </div>
      <div class="cw-slider" id="continueWatchingSlider"></div>
    </section>

    <!-- Filtering & Category Shelf -->
    <section class="controls-section">
      <div class="category-pills-row" id="categoryPillsRow">
        <button class="category-pill active" data-category="All" onclick="window.MovieList.setCategory('All')">All Titles</button>
        <button class="category-pill" data-category="Today's Updates" onclick="window.MovieList.setCategory('Today\'s Updates')">Today's Updates</button>
        <button class="category-pill" data-category="Top Rated" onclick="window.MovieList.setCategory('Top Rated')">Top Rated</button>
        <button class="category-pill" data-category="Hollywood 1080p" onclick="window.MovieList.setCategory('Hollywood 1080p')">Hollywood</button>
        <button class="category-pill" data-category="Bollywood" onclick="window.MovieList.setCategory('Bollywood')">Bollywood</button>
        <button class="category-pill" data-category="South Action" onclick="window.MovieList.setCategory('South Action')">South Action</button>
        <button class="category-pill" data-category="K-Drama" onclick="window.MovieList.setCategory('K-Drama')">K-Drama</button>
        <button class="category-pill" data-category="TV Series" onclick="window.MovieList.setCategory('TV Series')">TV Series</button>
        <button class="category-pill" data-category="Animation" onclick="window.MovieList.setCategory('Animation')">Animation</button>
        <button class="category-pill" data-category="Bangla" onclick="window.MovieList.setCategory('Bangla')">Bangla</button>
        <button class="category-pill" data-category="Watchlist" onclick="window.MovieList.setCategory('Watchlist')">Saved Watchlist</button>
      </div>

      <div class="sort-select-wrapper">
        <span class="sort-label">Sort:</span>
        <select class="sort-select" id="sortSelect" onchange="window.MovieList.setSort(this.value)">
          <option value="default">Default Order</option>
          <option value="rating">Highest Rated</option>
          <option value="year">Newest Release</option>
          <option value="title">Alphabetical (A-Z)</option>
        </select>
      </div>
    </section>

    <!-- Old Type Multi-Row Category Sliders (Default Home View) -->
    <section class="category-rows-container" id="categoryRowsContainer" aria-label="Category Sliders"></section>

    <!-- Catalog Section Header (Visible in Grid / Search / Specific Category View) -->
    <div class="catalog-header-row" id="catalogHeaderRow" style="display: none;">
      <div class="catalog-header-left">
        <button class="btn-back-to-all" id="btnBackToAll" onclick="window.MovieList.setCategory('All')" title="Back to All Categories">
          <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
          <span>All Categories</span>
        </button>
        <h3 class="catalog-section-title">
          <span id="catalogSectionTitleText">Explore Library</span>
          <span id="catalogCountBadge" class="catalog-section-badge">0 Titles</span>
        </h3>
      </div>
    </div>

    <!-- Movie Grid (Visible in Grid / Search / Category View) -->
    <main class="movies-grid-container" id="moviesGrid" style="display: none;"></main>

    <!-- Mobile Floating Bottom Dock -->
    <nav class="mobile-bottom-dock" aria-label="Mobile Dock Navigation">
      <button class="mobile-dock-btn active" id="dockBtnHome" onclick="window.MovieList.setCategory('All')">
        <i data-lucide="home" style="width:20px;height:20px;"></i>
        <span>Home</span>
      </button>
      <button class="mobile-dock-btn" id="dockBtnCategories" onclick="window.MovieList.scrollToCategories()">
        <i data-lucide="layers" style="width:20px;height:20px;"></i>
        <span>Categories</span>
      </button>
      <button class="mobile-dock-btn" id="dockBtnSearch" onclick="window.MovieList.focusSearch()">
        <i data-lucide="search" style="width:20px;height:20px;"></i>
        <span>Search</span>
      </button>
      <button class="mobile-dock-btn" id="dockBtnWatchlist" onclick="window.MovieList.setCategory('Watchlist')">
        <i data-lucide="bookmark" style="width:20px;height:20px;"></i>
        <span>Watchlist</span>
      </button>
      <button class="mobile-dock-btn" id="dockBtnTheme" onclick="window.MovieList.toggleTheme()">
        <i id="dockThemeIcon" data-lucide="sun" style="width:20px;height:20px;"></i>
        <span>Theme</span>
      </button>
    </nav>
  </div>

  <!-- Movie Details Modal -->
  <div class="modal-overlay" id="detailsModal" role="dialog" aria-modal="true" aria-labelledby="modalMovieTitle">
    <div class="details-modal-card">
      <button class="modal-close-btn" onclick="window.MovieList.closeDetails()" aria-label="Close modal">
        <i data-lucide="x" style="width:18px;height:18px;"></i>
      </button>

      <div class="modal-hero-banner">
        <img id="modalBackdropImg" class="modal-backdrop-img" src="" alt="Backdrop">
        <div class="modal-banner-gradient"></div>
      </div>

      <div class="modal-body-content">
        <div class="modal-header-grid">
          <div class="modal-poster-wrap">
            <img id="modalPosterImg" class="modal-poster-img" src="" alt="Poster">
          </div>
          <div class="modal-title-wrap">
            <h2 id="modalMovieTitle" class="modal-movie-title">Movie Title</h2>
            <div class="modal-chips-row">
              <span id="modalQualityTag" class="chip-tag chip-primary">HD</span>
              <span id="modalRatingTag" class="chip-tag chip-gold">8.5 Rating</span>
              <span id="modalCategoryTag" class="chip-tag">Category</span>
            </div>
          </div>
        </div>

        <div class="modal-details-grid">
          <div class="details-stat-box">
            <span class="stat-label">Year</span>
            <span class="stat-value" id="modalYearStat">2025</span>
          </div>
          <div class="details-stat-box">
            <span class="stat-label">Audio</span>
            <span class="stat-value">Dual Audio</span>
          </div>
          <div class="details-stat-box">
            <span class="stat-label">File Size</span>
            <span class="stat-value" id="modalSizeStat">2.5 GB</span>
          </div>
          <div class="details-stat-box">
            <span class="stat-label">Updated</span>
            <span class="stat-value" id="modalDateStat">Latest</span>
          </div>
        </div>

        <!-- Action Buttons Row -->
        <div class="modal-actions-row">
          <button class="btn-solid-primary" id="modalPlayBtn">
            <i data-lucide="play" style="width:16px;height:16px;fill:currentColor;"></i>
            Play Movie
          </button>
          <button class="btn-glass" id="modalExtPlayerBtn" onclick="window.MovieList.openExternalFromDetails()">
            <i data-lucide="tv" style="width:16px;height:16px;"></i>
            External App
          </button>
          <button class="btn-glass" id="modalTrailerBtn">
            <i data-lucide="film" style="width:16px;height:16px;"></i>
            Watch Trailer
          </button>
          <button class="btn-glass" id="modalWatchlistBtn">
            <i data-lucide="bookmark" style="width:16px;height:16px;"></i>
            Add to Watchlist
          </button>
        </div>

        <!-- External Player Launchers Hub -->
        <div class="external-players-card">
          <span class="external-players-title">Launch in External App</span>
          <div class="external-players-grid">
            <button class="btn-ext-player btn-ext-vlc" id="extBtnVlc" title="Play in VLC Media Player">
              <i data-lucide="play-circle" style="width:14px;height:14px;"></i>
              VLC Player
            </button>
            <button class="btn-ext-player btn-ext-mx" id="extBtnMx" title="Play in MX Player (Android)">
              <i data-lucide="smartphone" style="width:14px;height:14px;"></i>
              MX Player
            </button>
            <button class="btn-ext-player btn-ext-pot" id="extBtnPot" title="Play in PotPlayer (Windows)">
              <i data-lucide="monitor" style="width:14px;height:14px;"></i>
              PotPlayer
            </button>
            <button class="btn-ext-player btn-ext-copy" id="extBtnCopy" title="Copy Direct Video Link">
              <i data-lucide="copy" style="width:14px;height:14px;"></i>
              Copy Stream Link
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dedicated External Player Selection Modal -->
  <div class="modal-overlay" id="externalPlayersModal" role="dialog" aria-modal="true" aria-labelledby="extModalMovieTitle">
    <div class="ext-modal-card">
      <button class="modal-close-btn" onclick="window.MovieList.closeExternalPlayerModal()" aria-label="Close external players modal">
        <i data-lucide="x" style="width:18px;height:18px;"></i>
      </button>

      <div class="ext-modal-header">
        <div class="ext-modal-icon-badge">
          <i data-lucide="tv" style="width:22px;height:22px;color:var(--primary);"></i>
        </div>
        <div class="ext-modal-title-group">
          <h3 class="ext-modal-title">Play in External App</h3>
          <p class="ext-modal-subtitle" id="extModalMovieTitle">Choose preferred media player</p>
        </div>
      </div>

      <div class="ext-player-options-list">
        <button class="ext-player-option-item" onclick="window.MovieList.launchSelectedExternal('vlc')">
          <div class="ext-option-icon vlc-icon">
            <i data-lucide="play-circle" style="width:20px;height:20px;"></i>
          </div>
          <div class="ext-option-text">
            <span class="ext-option-name">
              VLC Media Player
              <span class="ext-default-badge" id="badgeDefaultVlc" style="display: none;">Default</span>
            </span>
            <span class="ext-option-desc">Universal player for Android, iOS, Windows, and Mac</span>
          </div>
          <i data-lucide="chevron-right" class="ext-option-chevron"></i>
        </button>

        <button class="ext-player-option-item" onclick="window.MovieList.launchSelectedExternal('mx')">
          <div class="ext-option-icon mx-icon">
            <i data-lucide="smartphone" style="width:20px;height:20px;"></i>
          </div>
          <div class="ext-option-text">
            <span class="ext-option-name">
              MX Player
              <span class="ext-default-badge" id="badgeDefaultMx" style="display: none;">Default</span>
            </span>
            <span class="ext-option-desc">Hardware acceleration for Android smartphones and tablets</span>
          </div>
          <i data-lucide="chevron-right" class="ext-option-chevron"></i>
        </button>

        <button class="ext-player-option-item" onclick="window.MovieList.launchSelectedExternal('pot')">
          <div class="ext-option-icon pot-icon">
            <i data-lucide="monitor" style="width:20px;height:20px;"></i>
          </div>
          <div class="ext-option-text">
            <span class="ext-option-name">
              PotPlayer
              <span class="ext-default-badge" id="badgeDefaultPot" style="display: none;">Default</span>
            </span>
            <span class="ext-option-desc">High-performance 64-bit playback for Windows PC</span>
          </div>
          <i data-lucide="chevron-right" class="ext-option-chevron"></i>
        </button>

        <button class="ext-player-option-item" onclick="window.MovieList.launchSelectedExternal('m3u')">
          <div class="ext-option-icon m3u-icon">
            <i data-lucide="download" style="width:20px;height:20px;"></i>
          </div>
          <div class="ext-option-text">
            <span class="ext-option-name">Download M3U Playlist</span>
            <span class="ext-option-desc">Open stream in KMPlayer, Kodi, or Apple QuickTime</span>
          </div>
          <i data-lucide="chevron-right" class="ext-option-chevron"></i>
        </button>

        <button class="ext-player-option-item" onclick="window.MovieList.launchSelectedExternal('copy')">
          <div class="ext-option-icon copy-icon">
            <i data-lucide="copy" style="width:20px;height:20px;"></i>
          </div>
          <div class="ext-option-text">
            <span class="ext-option-name">Copy Direct Stream Link</span>
            <span class="ext-option-desc">Copy video URL to clipboard for custom network streams</span>
          </div>
          <i data-lucide="chevron-right" class="ext-option-chevron"></i>
        </button>
      </div>

      <div class="ext-modal-footer">
        <label class="ext-default-toggle">
          <input type="checkbox" id="chkSetDefaultPlayer" onchange="window.MovieList.onDefaultToggle(this.checked)">
          <span>Remember selected player as default</span>
        </label>
        <button class="btn-clear-default" id="btnClearDefaultPlayer" style="display: none;" onclick="window.MovieList.clearDefaultPlayer()">
          Reset Default
        </button>
      </div>
    </div>
  </div>

  <!-- Built-In Video Player Modal with Dynamic Ambilight -->
  <div class="player-modal-overlay" id="playerModal" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
    <div class="player-cinema-box">
      <!-- Dynamic Ambilight Canvas -->
      <canvas id="playerAmbilightCanvas" class="player-ambilight-canvas" width="64" height="36"></canvas>

      <div class="player-top-header">
        <div class="player-title-info">
          <i data-lucide="tv" style="width:18px;height:18px;color:var(--primary);"></i>
          <span class="player-media-title" id="playerTitle">Playing Media</span>
        </div>
        <div class="player-controls-top-right">
          <button class="player-pill-btn" onclick="window.MovieList.openExternalFromPlayer()" title="Play in External App (VLC / MX)">
            <i data-lucide="tv" style="width:14px;height:14px;"></i>
            <span>External App</span>
          </button>
          <select class="player-speed-select" onchange="window.MovieList.setPlaybackSpeed(this.value)" title="Playback Speed">
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x (Normal)</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
          <button class="player-pill-btn active" id="btnToggleAmbilight" onclick="window.MovieList.toggleAmbilight()" title="Toggle Ambilight Glow">
            <i data-lucide="sparkles" style="width:14px;height:14px;"></i>
            <span>Ambilight</span>
          </button>
          <button class="player-exit-btn" onclick="window.MovieList.closePlayer()" title="Exit Player (Esc)" aria-label="Exit Player">
            <i data-lucide="x" style="width:18px;height:18px;"></i>
          </button>
        </div>
      </div>
      <video id="cinemaVideo" class="cinema-video-el" controls playsinline preload="auto"></video>
    </div>
  </div>

  <!-- Trailer Preview Modal -->
  <div class="trailer-modal-overlay" id="trailerModal" role="dialog" aria-modal="true" aria-labelledby="trailerMovieTitle">
    <div class="trailer-cinema-box">
      <div class="player-top-header">
        <div class="player-title-info">
          <i data-lucide="film" style="width:18px;height:18px;color:var(--accent);"></i>
          <span class="player-media-title" id="trailerMovieTitle">Trailer Preview</span>
        </div>
        <button class="player-exit-btn" onclick="window.MovieList.closeTrailer()" title="Exit Trailer (Esc)" aria-label="Exit Trailer">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </button>
      </div>
      <iframe id="trailerIframe" class="trailer-iframe" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Lucide Icons Library -->
  <script src="js/lucide.min.js"></script>

  <!-- MovieList Core Application Script -->
  <script src="js/movielist.js"></script>
</body>
</html>
